pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,mjs,ts,tsx,astro,json,jsonc,css,md}"
      run: pnpm exec biome check --write {staged_files}
    lint:
      glob: "*.{js,mjs,ts,tsx,astro,json,jsonc,css,md}"
      run: pnpm exec biome check {staged_files}
    typecheck:
      run: pnpm typecheck

commit-msg:
  commands:
    conventional:
      run: >-
        cat "{1}" | grep -Eq
        '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
        || (echo "Commit message must follow Conventional Commits" && exit 1)
